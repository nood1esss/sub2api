name: Build custom GHCR image

on:
  push:
    branches:
      - fix/v0.1.183-openai-images-oauth-n
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-ghcr-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare image reference
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA:0:12}"
          image="ghcr.io/${repository}"
          tag="0.1.183-oauth-image-n-${short_sha}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${image}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            VERSION=0.1.183-oauth-image-n
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=custom-image-amd64
          cache-to: type=gha,mode=max,scope=custom-image-amd64

      - name: Add image to job summary
        shell: bash
        run: |
          echo "### Custom Sub2API image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.image.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
