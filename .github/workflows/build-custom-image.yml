name: Build custom GHCR image

on:
  push:
    branches:
      - 'fix/v*-openai-images-oauth-n'
  workflow_dispatch:
    inputs:
      base_version:
        description: Official Sub2API version without the v prefix (for example, 0.2.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-ghcr-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare image reference
        id: image
        shell: bash
        env:
          MANUAL_BASE_VERSION: ${{ inputs.base_version }}
        run: |
          BASE_VERSION="$MANUAL_BASE_VERSION"
          if [[ -z "$BASE_VERSION" ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^fix/v([0-9]+\.[0-9]+\.[0-9]+)-openai-images-oauth-n$ ]]; then
              BASE_VERSION="${BASH_REMATCH[1]}"
            else
              echo "Cannot infer base_version from branch: $GITHUB_REF_NAME" >&2
              exit 1
            fi
          fi
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid base_version: $BASE_VERSION" >&2
            exit 1
          fi
          repository="${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA:0:12}"
          image="ghcr.io/${repository}"
          tag="${BASE_VERSION}-oauth-image-n-${short_sha}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${image}:${tag}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            VERSION=${{ steps.image.outputs.base_version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=custom-image-amd64
          cache-to: type=gha,mode=max,scope=custom-image-amd64

      - name: Add image to job summary
        shell: bash
        run: |
          echo "### Custom Sub2API image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.image.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
